[project]
name = "sentinel-proof"
version = "0.1.1"
description = "Catch RAG hallucinations without an LLM judge: check every number and citation in an LLM answer against the retrieved context, fix wrong citations, strip unsupported claims, and refuse what cannot be grounded."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "hallucination",
    "hallucination-detection",
    "llm",
    "llm-guardrails",
    "guardrails",
    "grounding",
    "groundedness",
    "faithfulness",
    "citations",
    "citation-verification",
    "fact-checking",
    "llm-evaluation",
    "ai-safety",
    "langchain",
    "llamaindex",
    "openai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/92kareeem/sentinel-rag"
Documentation = "https://github.com/92kareeem/sentinel-rag/tree/main/packages/sentinel-proof"
Source = "https://github.com/92kareeem/sentinel-rag/tree/main/packages/sentinel-proof/src/sentinel_proof"
Changelog = "https://github.com/92kareeem/sentinel-rag/blob/main/packages/sentinel-proof/CHANGELOG.md"
Issues = "https://github.com/92kareeem/sentinel-rag/issues"

[project.scripts]
sentinel-proof = "sentinel_proof.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel_proof = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Newer ruff also formats the Python blocks inside Markdown. The README's
# examples align their comments deliberately, so they are left alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
