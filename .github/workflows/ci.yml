name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint + typecheck need no native/ML deps, so they stay fast and fail early.
  static:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install ruff mypy pydantic pydantic-settings fastapi mangum httpx \
            boto3 langgraph rank-bm25 numpy python-multipart pytest moto[dynamodb]
      - name: Ruff
        run: ruff check backend
      - name: Mypy
        # Previously `|| true`, which meant type errors could never fail the
        # build and 43 of them accumulated unnoticed. The codebase is now clean,
        # so this is enforced.
        run: mypy backend/app --ignore-missing-imports

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch — the tests exercise real embeddings/FAISS)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Pytest
        run: pytest backend/tests -q
        env:
          PYTHONPATH: backend

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      # The answer renderer parses untrusted model output about user-supplied
      # documents. A guard that fails to advance there is an infinite loop in
      # the browser, which typechecking and a successful build both pass.
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: http://localhost:8000
          VITE_API_KEY: ci-placeholder

  docker:
    name: Lambda image builds from a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Guards the reproducibility bug this workflow previously missed: the
      # Dockerfile COPYed models/onnx/, which is gitignored, so the image could
      # not be built from a fresh clone at all.
      - name: Build image
        run: |
          docker build -f docker/Dockerfile.lambda -t sentinel-api:ci .

      # Building proves the image assembles; it does NOT prove the app starts.
      # A missing python-multipart shipped to production and 502'd every route
      # including /healthz, because FastAPI validates UploadFile parameters
      # when the route is REGISTERED — an import-time failure that a build can
      # never catch. This starts the container with the Lambda Runtime
      # Interface Emulator (present in the AWS base image) and invokes it the
      # way Lambda does.
      - name: Container actually starts and serves a request
        run: |
          docker run -d --name sentinel-ci -p 9000:8080 \
            -e LOCAL_MODE=true -e USE_S3_INDEX=false -e INDEX_DIR=/tmp/index \
            sentinel-api:ci

          # A Function URL event (payload format 2.0). sourceIp/userAgent are
          # not optional: Mangum reads requestContext.http.sourceIp directly
          # and raises KeyError without it, which looks like an app bug.
          EVENT='{"version":"2.0","rawPath":"/healthz","rawQueryString":"",
                  "headers":{"accept":"*/*"},
                  "requestContext":{"http":{"method":"GET","path":"/healthz",
                    "protocol":"HTTP/1.1","sourceIp":"127.0.0.1","userAgent":"ci"}},
                  "isBase64Encoded":false}'

          for i in $(seq 1 30); do
            if curl -fsS -XPOST \
              "http://localhost:9000/2015-03-31/functions/function/invocations" \
              -d "$EVENT" >/tmp/out.json 2>/dev/null; then
              break
            fi
            sleep 2
          done

          echo "--- response ---"; cat /tmp/out.json; echo
          echo "--- container logs ---"; docker logs sentinel-ci

          # Assert on the PARSED payload, not with grep. An import-time crash
          # still returns HTTP 200 from the emulator (with the traceback in the
          # body), so curl's exit code proves nothing — and the body is a
          # JSON-ESCAPED string inside the envelope, so grepping for
          # '"status":"ok"' never matches the literal bytes '\"status\":\"ok\"'.
          # Parsing both layers is the only assertion that means what it says.
          python3 - <<'PY'
          import json, sys
          env = json.load(open("/tmp/out.json"))
          assert env.get("statusCode") == 200, f"statusCode={env.get('statusCode')}: {env}"
          body = json.loads(env["body"])
          assert body.get("status") == "ok", f"unexpected body: {body}"
          print("container healthy:", body)
          PY

      - name: Clean up
        if: always()
        run: docker rm -f sentinel-ci || true
