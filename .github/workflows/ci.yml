name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint + typecheck need no native/ML deps, so they stay fast and fail early.
  static:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install ruff mypy pydantic pydantic-settings fastapi mangum httpx \
            boto3 langgraph rank-bm25 numpy python-multipart pytest moto[dynamodb]
      - name: Ruff
        run: ruff check backend
      - name: Mypy
        # Previously `|| true`, which meant type errors could never fail the
        # build and 43 of them accumulated unnoticed. The codebase is now clean,
        # so this is enforced.
        run: mypy backend/app --ignore-missing-imports

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch — the tests exercise real embeddings/FAISS)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Pytest
        run: pytest backend/tests -q
        env:
          PYTHONPATH: backend

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: http://localhost:8000
          VITE_API_KEY: ci-placeholder

  docker:
    name: Lambda image builds from a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Guards the reproducibility bug this workflow previously missed: the
      # Dockerfile COPYed models/onnx/, which is gitignored, so the image could
      # not be built from a fresh clone at all.
      - name: Build image
        run: |
          docker build -f docker/Dockerfile.lambda -t sentinel-api:ci .
