name: Evals
on:
  # Only when something that can actually move the numbers changes. A
  # frontend-only PR used to run the full suite — ~60 Groq calls to prove that
  # CSS did not affect retrieval quality.
  pull_request:
    paths:
      - "backend/**"
      - "evals/**"
      - "ingestion/**"
      - "corpus/**" # the documents the evals retrieve from
      - "pyproject.toml"
      - ".github/workflows/evals.yml"
  workflow_dispatch: # manual runs from the Actions tab

# Groq's free tier is rate-limited per ACCOUNT, not per run. Four PRs opened
# together previously fired four concurrent suites and 429'd each other into
# failure — a red X caused entirely by contention rather than by any
# regression. Serialize instead: queue runs rather than cancelling them, since
# an eval result is the point of the job.
concurrency:
  group: evals-${{ github.repository }}
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install full stack (evals embed the corpus locally)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      # ./corpus, NOT ./docs. The ingester takes every .md under the folder it
      # is given, so pointing it at ./docs indexed this repository's own
      # engineering documentation alongside the demo business documents — and
      # the golden dataset asserts that "what is the company's parental leave
      # policy?" and "which cloud provider hosts the infrastructure?" are
      # UNANSWERABLE. An ADR discussing a parental-leave example, or a system
      # guide naming AWS on every page, is enough to turn a correct refusal
      # into a confident answer and fail the refusal gate for a documentation
      # change. Engineering docs are not corpus.
      - name: Build index from the demo corpus
        run: python -m ingestion.ingest ./corpus
        working-directory: .
        env:
          PYTHONPATH: backend
      # Takes ~7 minutes, most of it deliberate waiting: the harness paces
      # itself to stay under Groq's free-tier 8,000 tokens/minute. Firing the
      # suite flat out rate-limits it, and the damage then reads as a drop in
      # answer quality rather than as a provider limit. A slow gate people
      # believe beats a fast one they learn to ignore.
      - name: "Run evals (gates: faithfulness >= 0.75, refusal >= 2/3)"
        run: python evals/run.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/report.md
