# Sentinel, the whole stack, no cloud account required.
#
#   cp .env.example .env        # add a free Groq key (or skip: the demo still runs)
#   docker compose up --build   # http://localhost:5173
#
# Air-gapped instead of Groq: set LLM_PROVIDER=local and
# LOCAL_LLM_BASE_URL=http://ollama:11434/v1 in .env, then
#   docker compose --profile ollama up --build
#   docker compose exec ollama ollama pull llama3.1:8b
#
# Storage is local files in the `sentinel-data` volume. The same code runs
# against DynamoDB + S3 + Lambda with STORAGE_BACKEND=aws (see infra/).

name: sentinel

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - path: .env
        required: false
    # These win over .env: compose is always the local, zero-AWS shape.
    environment:
      STORAGE_BACKEND: local
      DEMO_MODE: "true"
      INDEX_DIR: /data/index
      EMBED_BACKEND: onnx
      ONNX_MODEL_DIR: /opt/onnx
      REGRESSIONS_PATH: /app/evals/regressions.json
      INDEX_REFRESH_SECONDS: "0"
    ports:
      - "8000:8000"
    volumes:
      - sentinel-data:/data
      # Promoting a regression from the control plane writes the suite back
      # into your checkout, ready to commit (ADR 0008).
      - ./evals:/app/evals
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_BASE: http://localhost:8000
        VITE_API_KEY: demo-local
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.6.8
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  sentinel-data:
  ollama-models:
