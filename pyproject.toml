[project]
name = "sentinel"
version = "0.1.0"
description = "Self-healing, guardrailed agentic RAG platform (AWS free tier + Groq)"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.115",
    "mangum~=0.19",
    "pydantic~=2.9",
    "pydantic-settings~=2.6",
    "httpx~=0.27",
    "boto3~=1.35",
    # >=1.0.10: unsafe msgpack deserialization when loading checkpoints
    # (GHSA via Dependabot #14). ~=0.2 capped us below every fixed release.
    "langgraph>=1.0.10,<2",
    # Security floors for langgraph's own dependencies, which a langgraph
    # upgrade alone does not guarantee: unsafe JSON/BaseCache
    # deserialization (#13, #17) and unsafe URL path construction (#18).
    "langgraph-checkpoint>=4.1.1",
    "langgraph-sdk>=0.3.15",
    # Pulls torch (CPU wheels forced in Dockerfile.lambda). 3.x pinned
    # transformers <5, and transformers <5.10 has four advisories including
    # remote code execution at model load and a save_pretrained path
    # traversal (#15, #19, #20, #22). Local ingestion only: the Lambda image
    # does not ship transformers at all (see docker/requirements-lambda.txt).
    "sentence-transformers>=6.1,<7",
    "transformers>=5.10.0",
    "faiss-cpu~=1.9",
    "rank-bm25~=0.2.2",
    "pymupdf~=1.24",
    "numpy~=2.1",
    "python-multipart~=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",  # <9.0.3: vulnerable tmpdir handling (#16)
    "moto[dynamodb]~=5.0",
    # moto's only path to cryptography; 44-49 has a Bleichenbacher oracle in
    # PKCS#7 EnvelopedData decryption (#21). Test-only, never deployed.
    "cryptography>=50.0.0",
    "ruff~=0.8",
    "mypy~=1.13",
    "uvicorn~=0.32",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*", "ingestion*"]

[tool.setuptools.package-dir]
"" = "backend"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection uses calls in argument defaults by design
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
ignore_missing_imports = true      # faiss/rank_bm25/fitz ship no type stubs
mypy_path = "backend"
